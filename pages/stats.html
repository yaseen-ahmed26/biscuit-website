<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/components/navigation.js" defer></script>
</head>
<body>
    <navigation-bar></navigation-bar>

    <div class="wrapper">
        <div class="card">
            <h2>Game Stats</h2>
            <p id="description">View your lifetime game stats. Playtime shown in the following format: HH:MM:SS.</p>
            <div class="display-box">
                <p id="lifetime-biscuits">Lifetime Biscuits: 1000</p>
            </div>
            <div class="display-box">
                <p id="lifetime-playtime">Lifetime Playtime: 5000</p>
            </div>
            <div class="display-box">
                <p id="lifetime-clicks">Lifetime Clicks: 100</p>
            </div>
            <button class="final-btn" id="refresh-btn">Refresh</button>
        </div>
    </div>

    <script type="module" src="../js/stats.js"></script>
</div>
</body>
</html>
