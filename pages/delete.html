<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/components/navigation.js" defer></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>
</head>
<body>
    <navigation-bar></navigation-bar>

    <div class="wrapper">
        <div class="card">
            <h2>Delete Account</h2>
            <p id="description">Permanently delete your account. Enter the phrase "delete my account" to confirm.</p>
            <div class="input-box">
                <input type="text" required id="input-phrase" placeholder="delete my account">
            </div>
            <button class="final-btn" id="submit-btn" disabled>Enter Phrase</button>
        </div>
    </div>

    <script type="text/javascript"src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="../js/delete.js"></script>
</div>
</body>
</html>
