<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
  />
</head>
<body>
    <header>
        <h2 class="logo">Biscuit</h2>
    </header>

    <div class="wrapper">
        <div class="card">
            <h2>Login</h2>
            <p id="description">Sign in to your account.</p>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" required id="login-email">
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <button id="show-password" class="icon"><ion-icon id="image" name="eye"></ion-icon></button>
                    <input type="password" required id="login-password">
                    <label>Password</label>
                </div>
                <button type="submit" class="final-btn" id="login-btn">Log in</button>
                <p id="info" >Don't have an account? <a href="pages/register.html">Click here to sign up.</a></p>
            </form>
        </div>
    </div>

    <script type="text/javascript"src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="js/index.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
